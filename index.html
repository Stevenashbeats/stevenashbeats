<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logos/favicon.png" />

    <!-- SEO Meta Tags -->
    <title>Steve Nash – Finger Drumming World Champion | Live MPC Performances</title>
    <meta name="description" content="Steve Nash is a Finger Drumming World Champion, delivering high-energy live MPC performances, electronic, bass and drum-driven music worldwide." />
    <meta name="author" content="Steve Nash" />
    <meta name="keywords" content="Steve Nash, finger drumming, world champion, MPC performance, live electronic music, drum performance, bass music, live act, beatmaker, polish dj, dj, beats, polish producer, electronic beats" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.stevenashbeats.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.stevenashbeats.com" />
    <meta property="og:title" content="Steve Nash – Finger Drumming World Champion" />
    <meta property="og:description" content="World Champion in Finger Drumming. Explosive live MPC shows, electronic & bass-driven performances on global stages." />
    <meta property="og:image" content="https://www.stevenashbeats.com/photo/STEVE%20COVER.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@stevenashbeats" />
    <meta name="twitter:title" content="Steve Nash – Finger Drumming World Champion" />
    <meta name="twitter:description" content="World Champion in Finger Drumming. Explosive live MPC shows, electronic & bass-driven performances on global stages." />
    <meta name="twitter:image" content="https://www.stevenashbeats.com/photo/STEVE%20COVER.jpeg" />

    <!-- Preload LCP image -->
    <link rel="preload" as="image" type="image/webp" href="/photo/STEVE%20COVER.webp" fetchpriority="high" />

    <!-- Fonts - non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800;900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  </head>

  <body>
    <div id="root">
      <!-- Inline hero shell for fast LCP - replaced by React on mount -->
      <div style="position:relative;height:100vh;overflow:hidden;background:#000">
        <img src="/photo/STEVE COVER.webp" alt="" width="800" height="1030" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" fetchpriority="high" />
        <div style="position:absolute;inset:0;background:linear-gradient(to bottom right,rgba(0,0,0,.6),transparent,rgba(0,0,0,.8))"></div>
        <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.2),transparent)"></div>
        <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 1rem">
          <h1 style="font-size:clamp(3rem,8vw,6rem);font-weight:900;letter-spacing:.05em;margin-bottom:1rem;background:linear-gradient(to right,#fff,#e5e5e5,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-family:Lexend,sans-serif">STEVE NASH</h1>
          <div style="font-size:clamp(1.125rem,2.5vw,1.5rem);color:#d1d5db;font-weight:700;letter-spacing:.05em;text-align:center;max-width:42rem;font-family:Lexend,sans-serif">Finger Drumming World Champion</div>
          <div style="font-size:clamp(.875rem,1.5vw,1.125rem);color:#9ca3af;font-weight:300;letter-spacing:.05em;text-align:center;max-width:42rem;margin-top:2rem;font-family:Lexend,sans-serif">Music Producer • Sound Designer • Audio Engineer</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
